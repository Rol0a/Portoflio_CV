# Dev mirrors production's log rotation: without it Docker's json-file driver
# grows unbounded, and a dev box left running accumulates the same NOC output
# (~2,900 lines/day) as the server. Kept smaller here than in production.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - portfolio-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portfolio-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    command: npm run dev -- --host 0.0.0.0
    logging: *default-logging
    networks:
      - portfolio-net

  # Standalone network-health poller (no listening port, no auth needed —
  # see noc/monitor.py and docs/security.md). Writes to Postgres; the admin
  # dashboard's Network Health page reads its output via the backend.
  noc:
    build:
      context: ./noc
    env_file:
      - .env
    environment:
      - NOC_INTERVAL_SECONDS=30
      - NOC_BACKEND_URL=http://backend:8000
      # Use the least-privilege noc_writer role in dev too, so a missing GRANT
      # surfaces here instead of in production. Expands to nothing when
      # NOC_DB_PASSWORD is unset, and monitor.py then falls back to the shared
      # DATABASE_URL (announcing it at startup). Run `make noc-role` first.
      - NOC_DATABASE_URL=${NOC_DB_PASSWORD:+postgresql://noc_writer:${NOC_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolio}}
    read_only: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - portfolio-net

volumes:
  pgdata_dev:

networks:
  portfolio-net:
    driver: bridge
