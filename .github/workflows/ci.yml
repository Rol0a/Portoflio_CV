name: CI

# M15 (lint, typecheck, tests, image builds) and M16's dependency-scanning
# requirement, which is specifically that the audit FAILS the build on
# high/critical rather than merely reporting.

on:
  push:
    # This repo's default branch is `main`. It previously read `master`, so
    # every direct push to main ran zero CI — silently, because a workflow
    # whose trigger never matches reports no failure. `pull_request` was
    # unaffected (it fires regardless of base branch name), which is exactly
    # why the gap survived: PRs looked covered while direct pushes were not.
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run in progress for the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck, test, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, not `npm install` — it installs exactly the lockfile and
      # fails if the two have drifted. The production Dockerfile uses it too,
      # so this also guards the lockfile that stage depends on.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

      - name: Audit dependencies (fails on high/critical)
        run: npm audit --audit-level=high

  backend:
    name: Backend — tests, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://portfolio:postgres@localhost:5432/portfolio
      SESSION_SECRET_KEY: ci-not-a-real-secret
      # The retention sweep is a background task; tests drive purges directly,
      # and leaving the loop running would race them.
      RETENTION_PURGE_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Apply migrations
        run: alembic upgrade head

      # tests/test_noc_role.py skips unless the role exists; provisioning it
      # here means the privilege assertions actually run in CI rather than
      # silently skipping, which is the failure mode that matters for a
      # security test.
      - name: Provision the least-privilege noc_writer role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U portfolio -d portfolio \
            -v noc_password=ci-noc-password -v db_name=portfolio \
            -f ../scripts/create_noc_role.sql

      - run: pytest -q

      - name: Audit dependencies (fails on high/critical)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      # Catches the class of bug that only appears in the production stage —
      # e.g. the missing package-lock.json that made `npm ci` fail, which the
      # dev stage's `npm install` hid entirely (M14).
      - name: Build frontend production image
        run: docker build --target production --build-arg VITE_API_URL= -t portfolio-frontend:ci ./frontend

      - name: Build backend production image
        run: docker build --target production -t portfolio-backend:ci ./backend

      - name: Validate the Caddyfile
        run: |
          docker run --rm -e DOMAIN=portfolio.example.com \
            -v "$PWD/infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
